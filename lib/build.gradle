plugins {
    id 'java-library'
}

group = 'it.unicam.quasylab'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    api 'org.apache.commons:commons-math3:3.6.1'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
